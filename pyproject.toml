[project]
name = "ha-blueprints"
version = "0.0.0"
description = "Tests and tooling for AnalyticsEarth Home Assistant blueprints"
requires-python = ">=3.13"

[dependency-groups]
test = ["pytest-homeassistant-custom-component", "yamllint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
