blueprint:
  name: IKEA BILRESA dual button (Matter)
  author: AnalyticsEarth
  description: >-
    Control lights and scenes with one or more IKEA BILRESA dual button remotes
    paired to Home Assistant over Matter (Thread).


    **Mirroring:** select the button 1 entity from every remote in the first
    field and every button 2 entity in the second. Any remote then triggers the
    same actions.


    **Defaults (when lights are selected):** button 1 press = on, button 2
    press = off, hold = dim up / down until released, double press = next /
    previous scene in the scene cycle (or full / minimum brightness when no
    scenes are listed).


    **Overrides:** for each gesture, a *custom action* takes priority, then a
    *scene*, then the default light behaviour.


    Docs: https://github.com/AnalyticsEarth/ha-blueprints/blob/main/docs/ikea/bilresa-dual-button.md
  source_url: https://github.com/AnalyticsEarth/ha-blueprints/blob/main/blueprints/automation/ikea/bilresa-dual-button.yaml
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    remotes:
      name: Remotes
      icon: mdi:remote
      description: >-
        Each BILRESA dual button exposes two Matter button (event) entities,
        usually ending in `_1` and `_2`. Select one per remote in each field.
      input:
        button1:
          name: Button 1 (on / brighter)
          selector:
            entity:
              multiple: true
              filter:
                - integration: matter
                  domain: event
        button2:
          name: Button 2 (off / dimmer)
          selector:
            entity:
              multiple: true
              filter:
                - integration: matter
                  domain: event
    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      description: Lights driven by the default button behaviour. Leave empty to only use scenes / custom actions.
      input:
        lights:
          name: Lights
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        hold_step:
          name: Hold dimming step
          description: Brightness change per step while a button is held.
          default: 10
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "%"
        hold_interval:
          name: Hold step interval
          description: Time between brightness steps while held.
          default: 400
          selector:
            number:
              min: 100
              max: 2000
              step: 50
              unit_of_measurement: ms
        min_brightness:
          name: Minimum brightness
          description: Dimming stops here instead of switching the lights off.
          default: 1
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "%"
        transition:
          name: Transition
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
    scenes_section:
      name: Scenes
      icon: mdi:palette
      input:
        scene_cycle:
          name: Scene cycle
          description: >-
            Double press button 1 / button 2 to step forwards / backwards
            through these scenes (unless overridden below). The cycle continues
            from whichever of these scenes was activated most recently.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: scene
        scene_b1_single:
          name: Button 1 press scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        scene_b1_double:
          name: Button 1 double press scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        scene_b1_hold:
          name: Button 1 hold scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        scene_b2_single:
          name: Button 2 press scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        scene_b2_double:
          name: Button 2 double press scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        scene_b2_hold:
          name: Button 2 hold scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
    custom_section:
      name: Custom actions
      icon: mdi:script-text
      description: >-
        Anything set here replaces the scene / default behaviour for that
        gesture. Variables available: `button` (b1/b2), `gesture`
        (single/double/hold/release) and `trigger`.
      collapsed: true
      input:
        action_b1_single:
          name: Button 1 press
          default: []
          selector:
            action: {}
        action_b1_double:
          name: Button 1 double press
          default: []
          selector:
            action: {}
        action_b1_hold:
          name: Button 1 hold
          default: []
          selector:
            action: {}
        action_b1_release:
          name: Button 1 release (after hold)
          default: []
          selector:
            action: {}
        action_b2_single:
          name: Button 2 press
          default: []
          selector:
            action: {}
        action_b2_double:
          name: Button 2 double press
          default: []
          selector:
            action: {}
        action_b2_hold:
          name: Button 2 hold
          default: []
          selector:
            action: {}
        action_b2_release:
          name: Button 2 release (after hold)
          default: []
          selector:
            action: {}
    advanced_section:
      name: Advanced
      icon: mdi:cog
      collapsed: true
      input:
        debounce:
          name: Duplicate event window
          description: >-
            Identical events on the same entity within this window are ignored.
            0 disables the check.
          default: 0
          selector:
            number:
              min: 0
              max: 1000
              step: 10
              unit_of_measurement: ms
        uptime_sensor:
          name: Uptime sensor (optional)
          description: >-
            Matter can replay old button events when Home Assistant starts.
            Select the Uptime integration's sensor to ignore presses during the
            first 60 seconds after startup.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: timestamp

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input button1
    id: b1
  - trigger: state
    entity_id: !input button2
    id: b2

variables:
  lights: !input lights
  hold_step: !input hold_step
  hold_interval: !input hold_interval
  min_pct: !input min_brightness
  transition: !input transition
  scene_cycle: !input scene_cycle
  scene_b1_single: !input scene_b1_single
  scene_b1_double: !input scene_b1_double
  scene_b1_hold: !input scene_b1_hold
  scene_b2_single: !input scene_b2_single
  scene_b2_double: !input scene_b2_double
  scene_b2_hold: !input scene_b2_hold
  action_b1_single: !input action_b1_single
  action_b1_double: !input action_b1_double
  action_b1_hold: !input action_b1_hold
  action_b1_release: !input action_b1_release
  action_b2_single: !input action_b2_single
  action_b2_double: !input action_b2_double
  action_b2_hold: !input action_b2_hold
  action_b2_release: !input action_b2_release
  debounce: !input debounce
  uptime_sensor: !input uptime_sensor
  button: "{{ trigger.id }}"
  evt: "{{ trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' }}"
  types: "{{ trigger.to_state.attributes.get('event_types', []) if trigger.to_state else [] }}"
  # Multi-press capable Matter switches report presses as multi_press_N only.
  gesture: >-
    {% set multi = types | select('match', 'multi_press_') | list | count > 0 %}
    {% if evt == 'long_press' %}hold
    {% elif evt == 'long_release' %}release
    {% elif evt == 'multi_press_1' %}single
    {% elif evt == 'multi_press_2' %}double
    {% elif not multi and evt == 'short_release' %}single
    {% elif not multi and evt == 'initial_press' and 'short_release' not in types %}single
    {% else %}none{% endif %}
  key: "{{ button ~ '_' ~ gesture }}"
  custom_action: >-
    {{ {'b1_single': action_b1_single, 'b1_double': action_b1_double,
        'b1_hold': action_b1_hold, 'b2_single': action_b2_single,
        'b2_double': action_b2_double, 'b2_hold': action_b2_hold}.get(key, [])
       | default([], true) | count > 0 }}
  scene: >-
    {{ {'b1_single': scene_b1_single, 'b1_double': scene_b1_double,
        'b1_hold': scene_b1_hold, 'b2_single': scene_b2_single,
        'b2_double': scene_b2_double, 'b2_hold': scene_b2_hold}.get(key, '')
       | default('', true) }}
  has_lights: "{{ lights | default([], true) | count > 0 }}"
  has_cycle: "{{ scene_cycle | default([], true) | count > 0 }}"
  direction: "{{ 1 if button == 'b1' else -1 }}"

conditions:
  - alias: Ignore restarts, unavailable devices and unknown events
    condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and gesture != 'none' }}
  - alias: Ignore duplicate events
    condition: template
    value_template: >-
      {{ debounce | int(0) == 0
         or trigger.from_state.attributes.get('event_type') != evt
         or (as_timestamp(trigger.to_state.state, 0)
             - as_timestamp(trigger.from_state.state, 0)) * 1000 >= debounce | int(0) }}
  - alias: Ignore events replayed at startup
    condition: template
    value_template: >-
      {{ uptime_sensor in ['', none]
         or (as_timestamp(now()) - as_timestamp(states(uptime_sensor), 0)) > 60 }}

actions:
  - choose:
      # ------------------------------------------------------- custom actions
      - conditions: "{{ custom_action and key == 'b1_single' }}"
        sequence: !input action_b1_single
      - conditions: "{{ custom_action and key == 'b1_double' }}"
        sequence: !input action_b1_double
      - conditions: "{{ custom_action and key == 'b1_hold' }}"
        sequence: !input action_b1_hold
      - conditions: "{{ custom_action and key == 'b2_single' }}"
        sequence: !input action_b2_single
      - conditions: "{{ custom_action and key == 'b2_double' }}"
        sequence: !input action_b2_double
      - conditions: "{{ custom_action and key == 'b2_hold' }}"
        sequence: !input action_b2_hold
      # Release always runs (the restart already stopped any hold loop).
      - conditions: "{{ key == 'b1_release' }}"
        sequence: !input action_b1_release
      - conditions: "{{ key == 'b2_release' }}"
        sequence: !input action_b2_release
      # --------------------------------------------------------------- scenes
      - conditions: "{{ scene | count > 0 }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ scene }}"
            data:
              transition: "{{ transition }}"
      - conditions: "{{ gesture == 'double' and has_cycle }}"
        sequence:
          - alias: Activate next/previous scene in the cycle
            action: scene.turn_on
            target:
              entity_id: >-
                {% set ns = namespace(idx=-1, latest=0) %}
                {% for s in scene_cycle %}
                  {% set ts = as_timestamp(states(s), 0) %}
                  {% if ts > ns.latest %}
                    {% set ns.latest = ts %}{% set ns.idx = loop.index0 %}
                  {% endif %}
                {% endfor %}
                {% if ns.idx < 0 %}
                  {{ scene_cycle[0] if direction > 0 else scene_cycle[-1] }}
                {% else %}
                  {{ scene_cycle[(ns.idx + direction) % (scene_cycle | count)] }}
                {% endif %}
            data:
              transition: "{{ transition }}"
      # ------------------------------------------------- default light actions
      - conditions: "{{ has_lights and key == 'b1_single' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lights }}"
            data:
              transition: "{{ transition }}"
      - conditions: "{{ has_lights and key == 'b2_single' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ lights }}"
            data:
              transition: "{{ transition }}"
      - conditions: "{{ has_lights and key == 'b1_double' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lights }}"
            data:
              brightness_pct: 100
              transition: "{{ transition }}"
      - conditions: "{{ has_lights and key == 'b2_double' and lights | select('is_state', 'on') | list | count > 0 }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lights | select('is_state', 'on') | list }}"
            data:
              brightness_pct: "{{ min_pct }}"
              transition: "{{ transition }}"
      - conditions: "{{ has_lights and gesture == 'hold' }}"
        sequence:
          - variables:
              delta_pct: "{{ hold_step * direction }}"
              step_transition: "{{ hold_interval / 1000 }}"
              max_steps: "{{ (100 / hold_step) | round(0, 'ceil') | int + 2 }}"
          # Loops until the release event restarts this automation.
          - repeat:
              sequence:
                - alias: Step brightness of each light (clamped to minimum)
                  repeat:
                    for_each: "{{ lights }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ delta_pct > 0 or is_state(repeat.item, 'on') }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              brightness: >-
                                {% set cur = (state_attr(repeat.item, 'brightness') or 0) | int
                                   if is_state(repeat.item, 'on') else 0 %}
                                {% set floor = [1, (min_pct * 2.55) | round(0) | int] | max %}
                                {{ [floor, [255, (cur + delta_pct * 2.55) | round(0) | int] | min] | max }}
                              transition: "{{ step_transition }}"
                - delay:
                    milliseconds: "{{ hold_interval }}"
              until:
                - condition: template
                  value_template: "{{ repeat.index >= max_steps }}"
