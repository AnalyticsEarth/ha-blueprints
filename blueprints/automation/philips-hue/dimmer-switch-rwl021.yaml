blueprint:
  name: Philips Hue dimmer switch RWL020 / RWL021 (Hue Bridge)
  author: AnalyticsEarth
  description: >-
    Control lights and scenes with one or more Philips Hue dimmer switches
    (RWL020 / RWL021, the 4-button On / Up / Down / Off model) connected
    through a Hue Bridge and the Philips Hue integration.


    **Mirroring:** select the matching button entity from every switch that
    should behave identically. Any of them triggers the same actions.


    **Defaults (when lights are selected):** On = lights on, or the next scene
    in the scene cycle if they are already on (like the Hue app); Up / Down =
    brighter / dimmer, hold to keep dimming; Off = lights off; hold On = full
    brightness.


    **Overrides:** for each gesture, a *custom action* takes priority, then a
    *scene*, then the default light behaviour.


    Docs: https://github.com/AnalyticsEarth/ha-blueprints/blob/main/docs/philips-hue/dimmer-switch-rwl021.md
  source_url: https://github.com/AnalyticsEarth/ha-blueprints/blob/main/blueprints/automation/philips-hue/dimmer-switch-rwl021.yaml
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    remotes:
      name: Switches
      icon: mdi:remote
      description: >-
        Each switch has four event entities: Button 1 = On, Button 2 = Up,
        Button 3 = Down, Button 4 = Off. Select one per switch in each field
        to mirror several switches.
      input:
        on_buttons:
          name: On button(s) (Button 1)
          selector:
            entity:
              multiple: true
              filter:
                - integration: hue
                  domain: event
        up_buttons:
          name: Up button(s) (Button 2)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: hue
                  domain: event
        down_buttons:
          name: Down button(s) (Button 3)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: hue
                  domain: event
        off_buttons:
          name: Off button(s) (Button 4)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: hue
                  domain: event
    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      description: Lights driven by the default button behaviour. Leave empty to only use scenes / custom actions.
      input:
        lights:
          name: Lights
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        tap_step:
          name: Up / Down tap step
          default: 10
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "%"
        hold_step:
          name: Hold dimming step
          description: Brightness change per step while Up / Down is held.
          default: 10
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "%"
        hold_interval:
          name: Hold step interval
          description: Time between brightness steps while held.
          default: 400
          selector:
            number:
              min: 100
              max: 2000
              step: 50
              unit_of_measurement: ms
        min_brightness:
          name: Minimum brightness
          description: Dimming stops here instead of switching the lights off.
          default: 1
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "%"
        transition:
          name: Transition
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
    scenes_section:
      name: Scenes
      icon: mdi:palette
      input:
        scene_cycle:
          name: Scene cycle
          description: >-
            Pressing On while the lights are on steps to the next of these
            scenes. When the lights are off, On re-activates the scene used
            most recently (unless an On scene is set below).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: scene
        scene_on_tap:
          name: On scene
          description: Scene for On when the lights are off.
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        scene_on_hold:
          name: On hold scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        scene_off_tap:
          name: Off scene
          description: Activated instead of switching the lights off.
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        scene_off_hold:
          name: Off hold scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
    custom_section:
      name: Custom actions
      icon: mdi:script-text
      description: >-
        Anything set here replaces the scene / default behaviour for that
        gesture. Variables available: `button` (on/up/down/off), `gesture`
        (tap/hold/release) and `trigger`.
      collapsed: true
      input:
        action_on_tap:
          name: On tap
          default: []
          selector:
            action: {}
        action_on_hold:
          name: On hold
          default: []
          selector:
            action: {}
        action_up_tap:
          name: Up tap
          default: []
          selector:
            action: {}
        action_up_hold:
          name: Up hold
          default: []
          selector:
            action: {}
        action_up_release:
          name: Up release (after hold)
          default: []
          selector:
            action: {}
        action_down_tap:
          name: Down tap
          default: []
          selector:
            action: {}
        action_down_hold:
          name: Down hold
          default: []
          selector:
            action: {}
        action_down_release:
          name: Down release (after hold)
          default: []
          selector:
            action: {}
        action_off_tap:
          name: Off tap
          default: []
          selector:
            action: {}
        action_off_hold:
          name: Off hold
          default: []
          selector:
            action: {}
    advanced_section:
      name: Advanced
      icon: mdi:cog
      collapsed: true
      input:
        fast_taps:
          name: Respond on press
          description: >-
            The Hue Bridge delivers button events in batches about a second
            apart, so the release of a tap often arrives a second after the
            press. When on, taps run as soon as the press arrives. The catch:
            holding a button also runs its tap action first (as the Hue app
            does). Turn off to wait for the release instead.
          default: true
          selector:
            boolean: {}
        debounce:
          name: Duplicate event window
          description: >-
            Identical events on the same entity within this window are ignored.
            0 disables the check.
          default: 0
          selector:
            number:
              min: 0
              max: 1000
              step: 10
              unit_of_measurement: ms

# queued (not restart): the Hue Bridge can deliver two taps within a
# millisecond, and each must run in turn (e.g. two scene-cycle steps).
mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input on_buttons
    id: "on"
  - trigger: state
    entity_id: !input up_buttons
    id: up
  - trigger: state
    entity_id: !input down_buttons
    id: down
  - trigger: state
    entity_id: !input off_buttons
    id: "off"

variables:
  lights: !input lights
  tap_step: !input tap_step
  hold_step: !input hold_step
  hold_interval: !input hold_interval
  min_pct: !input min_brightness
  transition: !input transition
  scene_cycle: !input scene_cycle
  scene_on_tap: !input scene_on_tap
  scene_on_hold: !input scene_on_hold
  scene_off_tap: !input scene_off_tap
  scene_off_hold: !input scene_off_hold
  action_on_tap: !input action_on_tap
  action_on_hold: !input action_on_hold
  action_up_tap: !input action_up_tap
  action_up_hold: !input action_up_hold
  action_down_tap: !input action_down_tap
  action_down_hold: !input action_down_hold
  action_off_tap: !input action_off_tap
  action_off_hold: !input action_off_hold
  fast_taps: !input fast_taps
  debounce: !input debounce
  button: "{{ trigger.id }}"
  evt: "{{ trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' }}"
  # Hue also sends `repeat` about once a second while held; the blueprint
  # runs its own smoother loop from long_press until long_release instead.
  gesture: >-
    {% if evt == 'long_press' %}hold
    {% elif evt == 'long_release' %}release
    {% elif evt == 'initial_press' and fast_taps %}tap
    {% elif evt == 'short_release' and not fast_taps %}tap
    {% else %}none{% endif %}
  key: "{{ button ~ '_' ~ gesture }}"
  custom_action: >-
    {{ {'on_tap': action_on_tap, 'on_hold': action_on_hold,
        'up_tap': action_up_tap, 'up_hold': action_up_hold,
        'down_tap': action_down_tap, 'down_hold': action_down_hold,
        'off_tap': action_off_tap, 'off_hold': action_off_hold}.get(key, [])
       | default([], true) | count > 0 }}
  scene: >-
    {{ {'on_hold': scene_on_hold, 'off_tap': scene_off_tap,
        'off_hold': scene_off_hold}.get(key, '') | default('', true) }}
  has_lights: "{{ lights | default([], true) | count > 0 }}"
  has_cycle: "{{ scene_cycle | default([], true) | count > 0 }}"
  any_on: "{{ has_lights and lights | select('is_state', 'on') | list | count > 0 }}"

conditions:
  - alias: Ignore restores, unavailable devices and unused events
    condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and gesture != 'none' }}
  - alias: Ignore duplicate events
    condition: template
    value_template: >-
      {{ debounce | int(0) == 0
         or trigger.from_state.attributes.get('event_type') != evt
         or (as_timestamp(trigger.to_state.state, 0)
             - as_timestamp(trigger.from_state.state, 0)) * 1000 >= debounce | int(0) }}

actions:
  - choose:
      # ------------------------------------------------------- custom actions
      - conditions: "{{ custom_action and key == 'on_tap' }}"
        sequence: !input action_on_tap
      - conditions: "{{ custom_action and key == 'on_hold' }}"
        sequence: !input action_on_hold
      - conditions: "{{ custom_action and key == 'up_tap' }}"
        sequence: !input action_up_tap
      - conditions: "{{ custom_action and key == 'up_hold' }}"
        sequence: !input action_up_hold
      - conditions: "{{ custom_action and key == 'down_tap' }}"
        sequence: !input action_down_tap
      - conditions: "{{ custom_action and key == 'down_hold' }}"
        sequence: !input action_down_hold
      - conditions: "{{ custom_action and key == 'off_tap' }}"
        sequence: !input action_off_tap
      - conditions: "{{ custom_action and key == 'off_hold' }}"
        sequence: !input action_off_hold
      # Release runs after the hold loop (queued) has seen the release.
      - conditions: "{{ key == 'up_release' }}"
        sequence: !input action_up_release
      - conditions: "{{ key == 'down_release' }}"
        sequence: !input action_down_release
      # --------------------------------------------------------------- On tap
      - conditions: "{{ key == 'on_tap' and (has_cycle or scene_on_tap | default('', true) | count > 0 or has_lights) }}"
        sequence:
          - variables:
              direction: >-
                {% if has_cycle and (any_on or not has_lights) %}1
                {% else %}0{% endif %}
              on_scene: "{{ scene_on_tap | default('', true) }}"
          - choose:
              - alias: Lights already on (or scene-only) - next scene, or re-activate when off
                conditions: "{{ has_cycle and (direction == 1 or on_scene | count == 0) }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: >-
                        {% set ns = namespace(idx=-1, latest=0) %}
                        {% for s in scene_cycle %}
                          {% set ts = as_timestamp(states(s), 0) %}
                          {% if ts > ns.latest %}
                            {% set ns.latest = ts %}{% set ns.idx = loop.index0 %}
                          {% endif %}
                        {% endfor %}
                        {% if ns.idx < 0 %}
                          {{ scene_cycle[0] }}
                        {% else %}
                          {{ scene_cycle[(ns.idx + direction) % (scene_cycle | count)] }}
                        {% endif %}
                    data:
                      transition: "{{ transition }}"
              - conditions: "{{ on_scene | count > 0 }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ on_scene }}"
                    data:
                      transition: "{{ transition }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ lights }}"
                data:
                  transition: "{{ transition }}"
      # --------------------------------------------------------------- scenes
      - conditions: "{{ scene | count > 0 }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ scene }}"
            data:
              transition: "{{ transition }}"
      # ------------------------------------------------- default light actions
      - conditions: "{{ has_lights and key == 'off_tap' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ lights }}"
            data:
              transition: "{{ transition }}"
      - conditions: "{{ has_lights and key == 'on_hold' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lights }}"
            data:
              brightness_pct: 100
              transition: "{{ transition }}"
      - conditions: "{{ has_lights and key in ['up_tap', 'down_tap', 'up_hold', 'down_hold'] }}"
        sequence:
          - variables:
              direction: "{{ 1 if button == 'up' else -1 }}"
              holding: "{{ gesture == 'hold' }}"
              delta_pct: "{{ (hold_step if holding else tap_step) * direction }}"
              step_transition: "{{ hold_interval / 1000 if holding else transition }}"
              max_steps: "{{ ((100 / hold_step) | round(0, 'ceil') | int + 2) if holding else 1 }}"
          # A hold steps until the button's latest event is no longer a hold
          # (long_release arrives) or the safety limit is reached.
          - repeat:
              sequence:
                - alias: Step brightness of each light (clamped to minimum)
                  repeat:
                    for_each: "{{ lights }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ delta_pct > 0 or is_state(repeat.item, 'on') }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              brightness: >-
                                {% set cur = (state_attr(repeat.item, 'brightness') or 0) | int
                                   if is_state(repeat.item, 'on') else 0 %}
                                {% set floor = [1, (min_pct * 2.55) | round(0) | int] | max %}
                                {{ [floor, [255, (cur + delta_pct * 2.55) | round(0) | int] | min] | max }}
                              transition: "{{ step_transition }}"
                - if:
                    - condition: template
                      value_template: "{{ holding }}"
                  then:
                    - delay:
                        milliseconds: "{{ hold_interval }}"
              until:
                - condition: template
                  value_template: >-
                    {{ repeat.index >= max_steps
                       or state_attr(trigger.entity_id, 'event_type') not in ['long_press', 'repeat'] }}
